<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dolphin Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  --page:#e6e2d6; --page-ink:#33323c; --muted:#66646f;
  --shell:#d6d1c1; --shell-edge:#b1aa96; --shell-ink:#4a4956;
  --bezel:#555766; --bezel-ink:#c6c7d3;
  --btn:#8e2a55; --btn-edge:#581833; --btn-ink:#f6eaf0;
  --dpad:#2b2b33; --dpad-ink:#8a8a9c;
  --pill:#8a8796;
  --gb0:#0f380f; --gb1:#306230; --gb2:#8bac0f; --gb3:#9bbc0f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#15161b; --page-ink:#e5e4ec; --muted:#9897a6;
    --shell:#3a3b46; --shell-edge:#24252d; --shell-ink:#cfcfdc;
    --bezel:#24252c; --bezel-ink:#8f90a3;
    --btn:#a33466; --btn-edge:#621d3d; --btn-ink:#fcf0f6;
    --dpad:#111116; --dpad-ink:#6b6b80;
    --pill:#5c5b69;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#15161b; --page-ink:#e5e4ec; --muted:#9897a6;
  --shell:#3a3b46; --shell-edge:#24252d; --shell-ink:#cfcfdc;
  --bezel:#24252c; --bezel-ink:#8f90a3;
  --btn:#a33466; --btn-edge:#621d3d; --btn-ink:#fcf0f6;
  --dpad:#111116; --dpad-ink:#6b6b80;
  --pill:#5c5b69;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--page-ink);
  font-family:"VT323",ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
.pix{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace}

.wrap{max-width:520px;margin:0 auto;padding:16px 12px 20px}
.device{position:relative;background:var(--shell);border-radius:16px 16px 60px 16px;padding:18px 18px 30px;
  box-shadow:inset 0 -6px 0 var(--shell-edge),inset 0 2px 0 rgba(255,255,255,.25),0 10px 28px rgba(0,0,0,.18)}
.bezel{background:var(--bezel);border-radius:10px 10px 36px 10px;padding:10px 14px 20px;max-width:100%}
.btop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.brand{font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px;color:var(--bezel-ink);letter-spacing:1px}
.hud{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:"Press Start 2P",ui-monospace,monospace;font-size:8px;line-height:1;padding:4px 5px;color:var(--bezel-ink);border:2px solid var(--bezel-ink);border-radius:2px}
.chip.now{background:var(--gb2);color:var(--gb0);border-color:var(--gb2)}
.chip.done{background:var(--gb1);color:var(--gb3);border-color:var(--gb1)}
.chip.star{border-color:transparent;color:var(--gb2)}

.screen{position:relative;width:100%;aspect-ratio:10/9;background:var(--gb3);overflow:hidden;container-type:inline-size;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
#game{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated}

/* title */
.titlecard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--gb3);background:color-mix(in srgb,var(--gb3) 84%,transparent);color:var(--gb0);cursor:pointer;padding:6%}
.titlecard.hide{display:none}
.logo{font-family:"Press Start 2P",ui-monospace,monospace;font-size:30px;font-size:clamp(22px,9cqw,46px);line-height:1.15;text-shadow:4px 4px 0 var(--gb2);margin:0}
.tsub{font-size:22px;font-size:clamp(18px,5.6cqw,28px);margin:.35em 0 .5em}
.tsk{font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px;font-size:clamp(8px,2.4cqw,12px);color:var(--gb1);margin-bottom:1.6em;word-spacing:.6em}
.blink{font-family:"Press Start 2P",ui-monospace,monospace;font-size:11px;font-size:clamp(9px,2.8cqw,14px);animation:blink 1s steps(2,start) infinite}
.tkeys{margin-top:1.3em;font-size:17px;font-size:clamp(15px,4.2cqw,20px);color:var(--gb1);line-height:1.1}
@keyframes blink{to{visibility:hidden}}

/* overlay */
.ov{position:absolute;inset:0;display:none;color:var(--gb0)}
.ov.show{display:block}
.say{position:absolute;left:3%;right:3%;bottom:3%;min-height:31%;background:var(--gb3);border:4px solid var(--gb0);
  box-shadow:inset 0 0 0 3px var(--gb2);padding:16px 12px 12px;font-size:21px;font-size:clamp(17px,5cqw,26px);line-height:1.08;cursor:pointer}
.who{position:absolute;top:-14px;left:10px;background:var(--gb0);color:var(--gb3);font-family:"Press Start 2P",ui-monospace,monospace;
  font-size:9px;font-size:clamp(8px,2.3cqw,11px);padding:6px 7px}
.more{position:absolute;right:10px;bottom:4px;opacity:0}
.say.done .more{opacity:1;animation:bob .7s steps(2,start) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

.panel{position:absolute;inset:0;background:var(--gb3);overflow:auto;border:4px solid var(--gb0);
  padding:10px 12px 14px;font-size:19px;font-size:clamp(16px,4.5cqw,23px);line-height:1.1;
  scrollbar-width:thin;scrollbar-color:var(--gb1) var(--gb2)}
.panel p{margin:.4em 0}
.panel h3{font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px;font-size:clamp(9px,2.5cqw,12px);line-height:1.5;margin:.5em 0 .2em}
.ptag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:"Press Start 2P",ui-monospace,monospace;
  font-size:9px;font-size:clamp(8px,2.2cqw,11px);line-height:1.4;margin-bottom:8px}
.ptag .sk{background:var(--gb0);color:var(--gb3);padding:4px 6px}
.ptag .row{color:var(--gb1)}
.ptag .qn{margin-left:auto;color:var(--gb1)}
.prompt{font-size:1.05em}
.opt{display:flex;gap:6px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--gb0);background:var(--gb3);
  border:3px solid var(--gb0);padding:3px 8px 4px;margin:0 0 7px;cursor:pointer;line-height:1.05;box-shadow:3px 3px 0 var(--gb1)}
.opt .cur{visibility:hidden;flex:none}
.opt.sel{background:var(--gb2)}
.opt.sel .cur{visibility:visible}
.opt:focus{outline:none}
.opt:focus-visible{outline:3px dashed var(--gb0);outline-offset:3px}
.opt.wrong{opacity:.5;text-decoration:line-through;box-shadow:none;cursor:default;background:var(--gb3)}
.opt.wrong .cur{visibility:hidden}
.opt.right{background:var(--gb1);color:var(--gb3)}
.fb{display:none;margin:8px 0;padding:5px 8px;border:3px dashed var(--gb1)}
.fb.ok,.fb.no{display:block}
.fb.ok{border-style:solid;border-color:var(--gb0);background:var(--gb2)}
.cont,.alt{font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px;font-size:clamp(9px,2.4cqw,12px);line-height:1.3;
  background:var(--gb0);color:var(--gb3);border:3px solid var(--gb0);padding:10px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--gb1)}
.alt{background:var(--gb3);color:var(--gb0)}
.cont:focus,.alt:focus{outline:none}
.cont:focus-visible,.alt:focus-visible{outline:3px dashed var(--gb0);outline-offset:3px}
.btnrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.graph{display:block;width:100%;max-width:440px;height:auto;margin:0 auto 8px;border:3px solid var(--gb0);
  image-rendering:crisp-edges;image-rendering:pixelated}
.ref{border:3px solid var(--gb1);margin:6px 0;padding:3px 8px}
.ref summary{cursor:pointer;font-family:"Press Start 2P",ui-monospace,monospace;font-size:9px;font-size:clamp(8px,2.2cqw,11px);line-height:1.6;color:var(--gb1)}
.ref summary:focus-visible{outline:3px dashed var(--gb0)}
.dt{border-collapse:collapse;width:100%;margin:6px 0}
.dt th,.dt td{border:2px solid var(--gb0);padding:2px 6px;text-align:center}
.dt th{background:var(--gb1);color:var(--gb3);font-weight:normal}
.small{font-size:.9em;color:var(--gb1)}
.proc{margin:6px 0;padding:6px 8px 6px 30px;background:var(--gb2);border:3px solid var(--gb0)}
.proc li{margin:2px 0}
.lead{margin:4px 0 0}
.art{border-left:4px solid var(--gb1);padding-left:10px;margin:8px 0}
.src{font-size:.9em;color:var(--gb1)}
.model{background:var(--gb2);border:3px solid var(--gb0);padding:6px 10px}
.rep{border-top:3px solid var(--gb0);margin-top:10px;padding-top:2px}
.rep ul{list-style:none;padding:0;margin:4px 0}
.rep li{padding:1px 0}
.tip{color:var(--gb1)}
.big{font-family:"Press Start 2P",ui-monospace,monospace;font-size:12px;font-size:clamp(10px,3cqw,15px);line-height:1.5}
.banner{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:var(--gb0);color:var(--gb3);
  font-family:"Press Start 2P",ui-monospace,monospace;font-size:11px;font-size:clamp(9px,2.8cqw,14px);padding:10px 14px;
  display:flex;gap:16px;white-space:nowrap;border:3px solid var(--gb2)}

/* controls */
.ctrl{margin-top:22px;user-select:none;-webkit-user-select:none;touch-action:none}
.controls{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.dpad{position:relative;width:114px;height:114px;flex:none}
.dpad button,.dpad .mid{position:absolute;width:38px;height:38px;background:var(--dpad);border:none;padding:0;color:var(--dpad-ink);font-size:13px;line-height:38px}
.dpad button{cursor:pointer}
.dpad .up{left:38px;top:0;border-radius:4px 4px 0 0}
.dpad .dn{left:38px;top:76px;border-radius:0 0 4px 4px}
.dpad .lf{left:0;top:38px;border-radius:4px 0 0 4px}
.dpad .rt{left:76px;top:38px;border-radius:0 4px 4px 0}
.dpad .mid{left:38px;top:38px}
.dpad button.on{filter:brightness(1.8)}
.ab{display:flex;gap:16px;transform:rotate(-22deg);margin-right:4px}
.abw,.pw{display:flex;flex-direction:column;align-items:center;gap:7px}
.btn{width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--btn-ink);border:none;box-shadow:0 4px 0 var(--btn-edge);
  font-family:"Press Start 2P",ui-monospace,monospace;font-size:13px;cursor:pointer}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.abw span,.pw span{font-family:"Press Start 2P",ui-monospace,monospace;font-size:8px;color:var(--shell-ink)}
.pills{display:flex;justify-content:center;gap:28px;margin-top:20px}
.pw{transform:rotate(-22deg)}
.pill{width:48px;height:12px;border-radius:8px;background:var(--pill);border:none;cursor:pointer}
.pill.on{filter:brightness(1.4)}
.grille{position:absolute;right:26px;bottom:22px;display:flex;gap:7px;transform:rotate(-30deg)}
.grille i{display:block;width:5px;height:38px;border-radius:3px;background:var(--shell-edge)}
.help{text-align:center;color:var(--muted);font-size:18px;margin:14px 6px 0;line-height:1.15}

/* rewards */
.pearl{display:inline-block;width:.85em;height:.85em;border-radius:50%;vertical-align:-.12em;border:2px solid var(--gb0);
  background:radial-gradient(circle at 35% 35%,var(--gb3) 0 30%,var(--gb2) 34% 100%)}
.chip.pearls{border-color:transparent;color:var(--gb2);display:inline-flex;align-items:center;gap:4px}
.chip.pearls .pearl{border-color:var(--gb2)}
.chip.bump{animation:bump .5s steps(4,end)}
@keyframes bump{40%{transform:scale(1.5)}}
.pop{position:absolute;left:50%;top:20%;z-index:5;pointer-events:none;background:var(--gb0);color:var(--gb3);
  font-family:"Press Start 2P",ui-monospace,monospace;font-size:14px;font-size:clamp(11px,3.2cqw,18px);padding:10px 14px;border:3px solid var(--gb2);
  display:flex;align-items:center;gap:8px;white-space:nowrap;transform:translateX(-50%);animation:popup 1.3s steps(10,end) forwards}
.pop .pearl{border-color:var(--gb2)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}25%{transform:translate(-50%,0) scale(1)}75%{opacity:1;transform:translate(-50%,-14px)}100%{opacity:0;transform:translate(-50%,-34px)}}
.earn{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-weight:bold}
.award{text-align:center}
.award .big{font-size:16px;font-size:clamp(12px,3.6cqw,20px);margin-top:.4em}
.award .aname{font-family:"Press Start 2P",ui-monospace,monospace;font-size:13px;font-size:clamp(10px,3cqw,16px);line-height:1.5;margin:.3em 0}
.awardart{position:relative;width:min(40%,180px);margin:6px auto 8px}
.awardart canvas{display:block;width:100%;height:auto;image-rendering:crisp-edges;image-rendering:pixelated;animation:grow .7s steps(7,end)}
@keyframes grow{0%{transform:scale(.2) rotate(-12deg)}70%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.spark{position:absolute;width:10px;height:10px;background:var(--gb0);transform:rotate(45deg);animation:twinkle 1.2s steps(3,end) infinite}
.spark.s1{left:-8%;top:12%}.spark.s2{right:-6%;top:4%;animation-delay:.4s}.spark.s3{right:-10%;top:55%;animation-delay:.8s}.spark.s4{left:-4%;top:72%;animation-delay:.6s}
@keyframes twinkle{0%,100%{opacity:0;transform:rotate(45deg) scale(.3)}50%{opacity:1;transform:rotate(45deg) scale(1)}}
.award .btnrow{justify-content:center}
.badgerow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.badgerow canvas{width:56px;height:auto;image-rendering:crisp-edges;image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){.pop,.awardart canvas,.spark,.chip.bump{animation:none}.pop{display:none}}
@media (min-width:820px){
  .wrap{max-width:1500px;padding:12px 16px}
  .device{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:20px;align-items:center;border-radius:16px 60px 16px 16px;padding:14px 16px 18px}
  .bezel{padding:8px 12px 14px;border-radius:10px 10px 28px 10px}
  .btop{margin-bottom:6px}
  .screen{aspect-ratio:auto;height:max(440px, calc(100vh - 110px));background:var(--gb2)}
  #game{width:auto;height:100%;aspect-ratio:10/9;margin:0 auto;box-shadow:0 0 0 3px var(--gb0)}
  .say{left:max(3%, calc(50% - 440px));right:max(3%, calc(50% - 440px))}
  .panel{padding:14px max(16px, calc((100% - 1000px) / 2)) 18px}
  .qwrap.side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
  .qwrap.side .qside{position:sticky;top:0}
  .qwrap.side .graph{max-width:100%}
  .qwrap.side .lead{margin-top:0}
  .ctrl{margin-top:0;display:flex;flex-direction:column;align-items:center;gap:26px}
  .controls{flex-direction:column;gap:26px}
  .pills{margin-top:0}
  .grille,.help{display:none}
}
@media (prefers-reduced-motion:reduce){
  .blink,.say.done .more{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="device">
    <div class="bezel">
      <div class="btop">
        <span class="brand">DOLPHIN LAB</span>
        <div class="hud" id="hud" aria-label="Progress"></div>
      </div>
      <div class="screen" id="screen">
        <canvas id="game" width="160" height="144" aria-label="The lab. Walk your scientist to each station."></canvas>
        <div class="titlecard" id="title">
          <div>
            <p class="logo">DOLPHIN<br>LAB</p>
            <p class="tsub">Pick an experiment. Think like a scientist.</p>
            <p class="tsk">IS DQ EA RC</p>
            <p class="blink">PRESS A TO START</p>
            <p class="tkeys">Arrows or WASD to walk<br>Space or Enter for A, X for B</p>
          </div>
        </div>
        <div class="ov" id="ov"></div>
      </div>
    </div>
    <div class="ctrl">
      <div class="controls">
        <div class="dpad" aria-label="Direction pad">
          <button class="up" data-dir="up" tabindex="-1" aria-label="Up">▲</button>
          <button class="lf" data-dir="left" tabindex="-1" aria-label="Left">◀</button>
          <div class="mid"></div>
          <button class="rt" data-dir="right" tabindex="-1" aria-label="Right">▶</button>
          <button class="dn" data-dir="down" tabindex="-1" aria-label="Down">▼</button>
        </div>
        <div class="ab">
          <div class="abw"><button class="btn" data-btn="B" tabindex="-1" aria-label="B button, hint">B</button><span>HINT</span></div>
          <div class="abw"><button class="btn" data-btn="A" tabindex="-1" aria-label="A button, talk and choose">A</button><span>TALK</span></div>
        </div>
      </div>
      <div class="pills">
        <div class="pw"><button class="pill" data-btn="SOUND" tabindex="-1" aria-label="Toggle sound"></button><span id="sndlbl">SOUND ON</span></div>
        <div class="pw"><button class="pill" data-btn="START" tabindex="-1" aria-label="Start or show controls"></button><span>START</span></div>
      </div>
    </div>
    <div class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <p class="help">Keyboard: arrows or WASD to walk, Space or Enter for A, X for B (hint). You can also click or tap the answers.</p>
</div>

<script>(function(){
'use strict';

/* ---------- palette + tiny bitmap font ---------- */
const C=['#0f380f','#306230','#8bac0f','#9bbc0f'];
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',
S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',
Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
'4':'101101111001001','5':'111100110001110','6':'011100110101010','7':'111001010010010','8':'010101010101010','9':'010101011001110',
'.':'000000000000010',':':'000010000010000','(':'001010010010001',')':'100010010010100','/':'001001010100100','-':'000000111000000',
'!':'010010010000010',',':'000000000010100','?':'110001010000010',' ':'000000000000000','°':'010101010000000'};
function txt(g,s,x,y,col,rot){
  g.fillStyle=col; s=String(s).toUpperCase();
  for(let i=0;i<s.length;i++){
    const f=FONT[s[i]]; if(!f) continue;
    for(let p=0;p<15;p++){
      if(f.charCodeAt(p)!==49) continue;
      const cx=p%3, cy=(p/3)|0;
      if(rot) g.fillRect(x+cy,y-(i*4+cx),1,1); else g.fillRect(x+i*4+cx,y+cy,1,1);
    }
  }
}
function tw(s){return String(s).length*4-1;}

/* ---------- canvas ---------- */
const cv=document.getElementById('game'); const ctx=cv.getContext('2d');
function R(x,y,w,h,c){ctx.fillStyle=C[c];ctx.fillRect(x,y,w,h);}
function box(x,y,w,h,f,o){R(x,y,w,h,o);R(x+1,y+1,w-2,h-2,f);}

const BODY=[
"................",
".....000000.....",
"....01111110....",
"...0111111110...",
"...0122222210...",
"...0333333330...",
"...0303333030...",
"...0233333320...",
"....03311330....",
".....000000.....",
"...0331001330...",
"..033310013330..",
"..033310013330..",
"..023333333320.."];
const LEGS={
  stand:["....010..010....","...0000..0000..."],
  b:["....010..000....","...0000........."],
  c:["....000..010....",".........0000..."]};
function drawRows(rows,x,y){
  for(let r=0;r<rows.length;r++){const row=rows[r];
    for(let i=0;i<row.length;i++){const ch=row[i]; if(ch==='.') continue; ctx.fillStyle=C[+ch]; ctx.fillRect(x+i,y+r,1,1);}}
}

/* ---------- game state ---------- */
const S={mode:'title',inv:'music',px:72,py:66,walkT:0,moving:false,stage:0,growth:0,results:{},t:0,sound:true,gen:0,cut:null,pearls:0,streak:0,spStart:0,
  graph:{axes:false,x:false,y:false,scale:false,trend:false,title:false}};
const held={up:false,down:false,left:false,right:false};

INV.music={
  key:'music', pick:`Does music help plants grow?`,
  intro:`Today’s question: does music help plants grow? Let’s find out like real scientists.`,
  names:{IS:'Planning Desk',DQ:'Plant Bench',EA:'Whiteboard',RC:'Bookshelf'},
  days:21,
  data:[[0,4.2],[2,4.8],[4,5.1],[6,5.7],[8,6.0]],
  dataHead:['Hours of music per day (hours/day)','Average height change (cm)'],
  dataNote:`Each average comes from 10 plants per group, across 3 trials.`,
  fmt:v=>v.toFixed(1),
  graph:{PL:26,xMax:10,xStep:2,yMax:7,yStep:1,fit:1,xLabel:'HOURS OF MUSIC PER DAY (HOURS/DAY)',yLabel:'AVERAGE HEIGHT CHANGE (CM)',
    title:['FIG. 1: EFFECT OF HOURS OF MUSIC PER DAY','ON AVERAGE HEIGHT CHANGE OF BEAN PLANTS']},
  propText:[`A speaker. Hmm, I wonder what we’ll use this for.`,`The speaker plays music for the plants at 60 dB, the same volume for every group. Volume is a controlled variable!`],
  science:[`Before the reasoning, some background science. Sound is a vibration that travels through the air.`,
    `Scientists have found that plants can sense vibrations, using cells that respond to being touched or moved.`],
  rcIntro:`Other scientists have studied how plants respond to sound. Read these two articles carefully. You can re-read them during every question.`,
  note:`A note from Finn: the data in this experiment was invented for the game. Real studies on music and plant growth have mixed results, which is exactly why scientists keep testing. The two articles are simplified summaries of real studies.`,
  art1:`<article class="art"><h3>Plants Can Sense a Hungry Caterpillar</h3>
<p class="src">Adapted from research by Heidi Appel and Rex Cocroft, University of Missouri (2014)</p>
<p>When a caterpillar chews on a leaf, it makes tiny vibrations that travel through the plant. Researchers wondered whether plants could detect these vibrations. They recorded the vibrations of caterpillars eating thale cress, a small plant related to mustard. Then they played the recording through the leaves of some plants, while other plants sat in silence.</p>
<p>Later, real caterpillars were allowed to feed on all of the plants. The plants that had felt the chewing vibrations earlier made more mustard oils, chemicals that taste bad to caterpillars. Plants did not react this way to vibrations from wind or from insect sounds that weren’t chewing. This suggests plants can tell different vibrations apart and use them to prepare for danger.</p></article>`,
  art2:`<article class="art"><h3>Pea Roots Follow the Sound of Water</h3>
<p class="src">Adapted from research led by Monica Gagliano, University of Western Australia (2017)</p>
<p>Plant roots need to find water, but soil is dark and crowded. Researchers wondered whether roots might use sound to help. They grew pea plants in pots shaped like an upside-down Y, so the roots had to choose between two directions. Next to one side, water flowed through a sealed pipe. The water could not leak into the soil, so the roots could not feel any moisture, only the vibrations of the moving water.</p>
<p>The roots grew toward the side with the flowing water. However, when the soil itself had a wet side, roots followed the moisture instead of the sound. This suggests that sound may help roots find water when other clues are missing.</p></article>`,
  model:`<p>Here’s what a strong synthesis paragraph could look like:</p>
<p class="model">Both studies show that plants can sense vibrations around them and respond in ways that help them survive. When thale cress plants sensed recorded caterpillar chewing, they later made more chemicals to defend themselves, but vibrations from wind did not have the same effect. Pea roots showed a similar skill by growing toward the sound of water moving through a sealed pipe, even though no moisture reached them. Whether a vibration signals danger or something a plant needs, plants seem to use vibrations as information about their surroundings. This research suggests one possible reason music could affect how plants grow.</p>
<p>It opens with the idea that links both studies, includes the key finding from each, skips the rabbit holes, weaves the articles together, and every sentence is in new words.</p>`,
  Q:{
IS:[
 {id:'is1',row:'Question',p:`First, a scientific question. Which one is clear and testable, with a specific IV and DV?`,a:2,o:[
  [`Do plants like music?`,`We can’t measure whether a plant “likes” something. A testable question is about something we can measure.`],
  [`What is the effect of music on plants?`,`Closer! But what about the music changes, and what do we measure on the plants? Both variables need to be specific.`],
  [`How does the number of hours of music played per day affect the height growth of bean plants?`,`The IV (hours of music per day) and the DV (height growth) are both specific and measurable.`],
  [`Which song do plants grow best to?`,`There’s no clear, measurable variable here, and testing every song ever written would take a while.`]]},
 {id:'is2',row:'Variables: IV',p:`What is the independent variable, the one YOU change on purpose?`,a:1,o:[
  [`The speaker`,`That’s an object, not a variable. A variable is something that can change and be measured.`],
  [`Hours of music played per day (hours/day)`,`It’s specific, it matches the question, and it has units.`],
  [`Change in plant height (cm)`,`That’s what you measure to see the effect, so it’s the dependent variable.`],
  [`Music`,`Too vague. What about the music are you changing: the volume, the song, the hours? Be specific.`]]},
 {id:'is3',row:'Variables: DV',p:`Which dependent variable is specific and measurable?`,a:3,o:[
  [`How healthy the plants look`,`“Healthy-looking” depends on who’s looking. Pick something you can measure with a tool.`],
  [`The bean plants`,`That’s an object again! What about the plants are you measuring?`],
  [`Hours of music per day (hours/day)`,`That’s the IV, the variable you change.`],
  [`Change in plant height over 21 days (cm)`,`You can measure it with a ruler, and it has units.`]]},
 {id:'is4',row:'Variables: CVs',p:`Which list shows controlled variables that NEED to be controlled, with amounts?`,a:0,o:[
  [`Plant type (bean), water (50 mL every 2 days), light (12 hours/day), music volume (60 dB)`,`Each of these could affect growth, and each has an amount. Keeping the volume the same means only the hours of music change.`],
  [`Type of plant, color of the pots, day of the week`,`Pot color and the day of the week probably won’t affect growth. Controlled variables are things that could change your results if they weren’t kept the same.`],
  [`Water, sunlight, soil`,`Good variables, but no amounts. How much water? How many hours of light?`],
  [`Hours of music, plant height, amount of water`,`The first two are your IV and DV. You can’t control the variables you’re testing!`]]},
 {id:'is5',row:'Hypothesis',p:`Which hypothesis is strongest? Remember the frame: As the IV ___, the DV ___ because ___.`,a:3,o:[
  [`Music will make the plants grow.`,`This doesn’t describe how the variables are related, and there’s no “because.”`],
  [`As the hours of music per day increase, the plants will grow taller.`,`Good relationship! But a hypothesis also explains WHY. Where’s your “because”?`],
  [`As the volume of the music increases, the plants will grow taller because the vibrations are stronger.`,`Careful! Your question is about hours of music, not volume. The hypothesis has to match your question.`],
  [`As the hours of music per day increase, the height growth of the plants will increase because plants can sense sound vibrations, which may trigger growth.`,`It matches the question, describes the relationship, and gives a reason.`]]},
 {id:'is6',row:'Procedure: sample size',pre:proc(`Your draft procedure:`,[`Set up 5 groups of 2 bean plants each.`,`Play music for 0, 2, 4, 6, or 8 hours per day at 60 dB.`,`Give every plant 50 mL of water every 2 days and 12 hours of light per day.`,`Measure each plant’s height in cm on Day 1 and Day 21.`]),
  p:`What’s the problem with step 1?`,a:1,o:[
  [`There should be fewer groups.`,`Five groups gives you five data points for your graph. That part is fine.`],
  [`2 plants per group is too small. One weird plant could throw off the results, so use more, like 10 per group.`,`A large sample size makes your results more reliable.`],
  [`The plants should all be different types.`,`Plant type is a controlled variable. It should stay the same.`],
  [`Nothing, it looks great!`,`Look closer at the number of plants in each group.`]]},
 {id:'is7',row:'Procedure: repeated trials',pre:proc(`Your updated procedure:`,[`Set up 5 groups of 10 bean plants each.`,`Play music for 0, 2, 4, 6, or 8 hours per day at 60 dB.`,`Give every plant 50 mL of water every 2 days and 12 hours of light per day.`,`Measure each plant’s height in cm on Day 1 and Day 21.`]),
  p:`Which of the 5 procedure elements is still missing?`,a:2,o:[
  [`How the IV will be manipulated`,`Step 2 already does that: 0, 2, 4, 6, or 8 hours per day.`],
  [`How the DV will be measured`,`Step 4 covers that: height in cm on Day 1 and Day 21.`],
  [`Repeated trials`,`Running the whole experiment 3 times shows whether your results happen again or were just luck.`],
  [`How the CVs will be controlled`,`Step 3 handles that: the same water and light for every plant.`]]}
],
DQ:[
 {id:'dq1',row:'Graph Type',fx:'axes',p:`Which type of graph fits this data best?`,a:2,o:[
  [`Bar graph`,`Bar graphs work best when the IV is in categories, like rock vs. jazz. Your IV is a number that changes smoothly.`],
  [`Pie chart`,`Pie charts show parts of a whole. Your data shows how one variable changes with another.`],
  [`Scatter plot with a line of best fit`,`Both variables are numbers, and a line of best fit will show the trend.`],
  [`Pictograph with little plant drawings`,`Cute, but not precise enough for science data.`]]},
 {id:'dq2',row:'Axes & Units: x-axis',fx:'x',p:`Which variable goes on the x-axis?`,a:3,o:[
  [`Average height change (cm)`,`That’s your DV. The DV goes on the y-axis.`],
  [`Trial number`,`You averaged the trials together, so trial number doesn’t get an axis.`],
  [`Plant type`,`Plant type was a controlled variable. It stayed the same, so it doesn’t get an axis.`],
  [`Hours of music per day (hours/day)`,`The independent variable always goes on the x-axis, with its units in parentheses.`]]},
 {id:'dq3',row:'Axes & Units: y-axis label',fx:'y',p:`Pick the best y-axis label.`,a:1,o:[
  [`Height`,`Which height? And in what units? Labels need detail and units.`],
  [`Average height change (cm)`,`A clear label with units in parentheses.`],
  [`Average height change`,`Good detail, but where are the units?`],
  [`cm`,`Units alone don’t tell the reader what was measured.`]]},
 {id:'dq4',row:'Scale',fx:'scale',p:`Your data goes from 4.2 to 6.0 cm. Which y-axis scale is best?`,a:1,o:[
  [`0, 2, 5, 6, 10`,`The jumps aren’t equal (2, 3, 1, 4). Uneven spacing makes the trend look different than it really is.`],
  [`0, 1, 2, 3, 4, 5, 6, 7`,`Equal increments that fit your data. Now the points can go on!`],
  [`4.2, 4.8, 5.1, 5.7, 6.0`,`Those are just your data values! The axis needs equal, consistent increments.`],
  [`0, 10, 20, 30, 40`,`The increments are equal, but your data would be squished into the bottom of the graph.`]]},
 {id:'dq5',row:'Trendline',fx:'trend',p:`Which line of best fit is accurate?`,a:2,o:[
  [`A zigzag line that connects every point, dot to dot`,`A line of best fit doesn’t have to touch every point. It shows the overall trend.`],
  [`A line from (0, 0) to the last point`,`Your data doesn’t start at zero, so forcing the line through (0, 0) misrepresents it.`],
  [`A straight line through the middle of the points, with about as many points above it as below it`,`That’s a line of best fit.`],
  [`A flat line at the average height`,`A flat line says the DV doesn’t change. Your data clearly goes up.`]]},
 {id:'dq6',row:'Title: wording',p:`Choose the best title.`,a:0,o:[
  [`Fig. 1: Effect of Hours of Music per Day on Average Height Change of Bean Plants`,`It starts with “Fig. 1” and names both the IV and the DV.`],
  [`Fig. 1: Plants and Music`,`Too general. A strong title names both variables.`],
  [`Effect of Hours of Music per Day on Average Height Change of Bean Plants`,`Great detail, but it’s missing “Fig. 1” at the start.`],
  [`Fig. 1: My Awesome Graph`,`It IS awesome. But the title needs to name both variables.`]]},
 {id:'dq7',row:'Title: placement',fx:'title',p:`Last step! Where does the title go?`,a:1,o:[
  [`Above the graph`,`That’s common in newspapers, but in science reports, figure titles go underneath.`],
  [`Underneath the graph`,`Scientific figures put the title below. Your graph is complete!`],
  [`On the y-axis`,`The axis already has its label. The title gets its own spot.`],
  [`Anywhere, as long as it’s big`,`Scientists follow conventions so every reader knows where to look.`]]}
],
EA:[
 {id:'ea1',row:'Claim',p:`Which claim is best? It should answer the question and describe the relationship between the variables.`,a:2,o:[
  [`Music is good for plants.`,`Too general. Which variable changed, and how did the plants respond?`],
  [`Plants with 8 hours of music per day grew 6.0 cm.`,`That’s a piece of evidence, not a claim. A claim answers the whole question.`],
  [`As the hours of music per day increased, the average height change of the bean plants increased.`,`It answers the question and describes the relationship between the IV and the DV.`],
  [`As the hours of music increased, the plants grew more because they enjoyed it.`,`The first part is good, but the claim shouldn’t include reasoning, and “enjoyed it” isn’t scientific.`]]},
 {id:'ea2',row:'Evidence: specific data',p:`Which evidence is specific and includes units?`,a:3,o:[
  [`The plants that got more music grew more.`,`No numbers! Evidence needs specific data.`],
  [`Plants with 8 hours of music grew 6.0.`,`6.0 what? And one data point isn’t enough to show a pattern.`],
  [`I could see that the plants on the right side of the bench looked bigger.`,`Observations are a start, but measured data is much stronger.`],
  [`Plants with 0 hours of music per day grew an average of 4.2 cm, while plants with 8 hours per day grew 6.0 cm. Average growth increased at every step in between.`,`Specific, with units, and it shows the whole pattern.`]]},
 {id:'ea3',row:'Evidence: sufficient',p:`Which detail makes your evidence more convincing?`,a:0,o:[
  [`Each average came from 10 plants per group, and the experiment was repeated 3 times.`,`A large sample and repeated trials make it hard to argue your results were luck.`],
  [`The speaker was really expensive.`,`The price of the speaker doesn’t make the data more reliable.`],
  [`The plants were a nice shade of green.`,`Nice, but not evidence about growth.`],
  [`You really wanted it to work.`,`Scientists try hard NOT to let what they want affect their results!`]]},
 {id:'ea4',row:'Reasoning',p:`Which reasoning best explains WHY the data counts as evidence for the claim?`,a:1,o:[
  [`The data shows that the plants grew more with more music, so the claim is correct.`,`This just repeats the evidence. Reasoning needs a science concept that explains the pattern.`],
  [`Sound is a vibration, and plants have cells that can sense vibrations. More hours of music means more vibrations for the plants to sense, which may trigger a growth response. This explains why growth increased as hours of music increased.`,`It uses a science concept to connect the IV to the DV.`],
  [`Plants grow because of photosynthesis.`,`True! But it doesn’t connect to music. Reasoning links your IV to your DV.`],
  [`Music makes plants happy, and happy plants grow more.`,`Plants don’t have feelings like we do. Reasoning has to use accepted science.`]]}
],
RC:[
 {id:'rc1',row:'Synthesis: topic sentence',p:`A strong summary opens with a topic sentence about the big idea that links BOTH articles. Which is best?`,a:1,o:[
  [`Caterpillars can be very harmful to plants.`,`This only covers Article 1, and it misses the main idea about sensing vibrations.`],
  [`Both studies show that plants can sense vibrations around them and respond in ways that help them survive.`,`This names the idea that unifies both articles.`],
  [`This paragraph is about two articles on plants.`,`This announces the topic but doesn’t say anything about it. A topic sentence makes a point.`],
  [`Pea plants are able to find water using their roots.`,`That’s only Article 2. The topic sentence should connect both.`]]},
 {id:'rc2',row:'Breadth',p:`Breadth means including all the important points. Which set must your summary include?`,a:2,o:[
  [`The caterpillar study took place at the University of Missouri, and the pea pots were shaped like a Y.`,`True, but these are small details, not the main findings.`],
  [`Caterpillars eat leaves, and roots need water.`,`Too general. These don’t describe what the researchers discovered.`],
  [`Plants that felt chewing vibrations made more defense chemicals, and pea roots grew toward the sound of flowing water.`,`These are the key findings of each study.`],
  [`Only the caterpillar study, because it came first.`,`A synthesis needs the important points from BOTH articles.`]]},
 {id:'rc3',row:'Depth: rabbit holes',p:`Depth means not too general and not too specific. Which detail is a “rabbit hole,” too minor for a short summary?`,a:2,o:[
  [`Plants made more mustard oils after sensing chewing vibrations.`,`That’s a key finding. Keep it!`],
  [`Roots grew toward the sound of water even though no moisture reached them.`,`That’s the main result of Article 2. Keep it!`],
  [`Thale cress is related to mustard.`,`Interesting, but it doesn’t help explain the big idea. Leave it out.`],
  [`Plants didn’t react the same way to wind vibrations.`,`This one is useful. It shows plants can tell different vibrations apart.`]]},
 {id:'rc4',row:'Depth: level of detail',p:`Which sentence has the right depth for a summary?`,a:3,o:[
  [`Plants can do lots of interesting things with sound.`,`Too general. This could describe almost any article about plants.`],
  [`The researchers recorded caterpillar vibrations, played them through the leaves of some thale cress plants, kept other plants in silence, and then let real caterpillars feed on all of them.`,`Accurate, but that’s the whole method! A short summary focuses on what was found.`],
  [`Article 1 is about caterpillars.`,`Too general, and it describes the article instead of the findings.`],
  [`When plants sensed recorded caterpillar chewing, they later made more chemicals to defend themselves.`,`Specific enough to mean something, short enough for a summary.`]]},
 {id:'rc5',row:'Synthesis: weaving',p:`Which sentence weaves the two articles together instead of summarizing them one at a time?`,a:2,o:[
  [`In the first article, plants sensed caterpillars. In the second article, roots found water.`,`This summarizes one article, then the other. Look for a sentence that connects them.`],
  [`The second article was more interesting than the first.`,`That’s an opinion, not a connection between the findings.`],
  [`Whether a vibration signals danger, like a chewing caterpillar, or something a plant needs, like flowing water, plants seem to use vibrations as information about their surroundings.`,`One sentence, both articles, one big idea.`],
  [`Pea roots grew toward the sound of flowing water.`,`That’s only Article 2.`]]},
 {id:'rc6',row:'Synthesis: own words',p:`Article 1 says: “The plants that had felt the chewing vibrations earlier made more mustard oils, chemicals that taste bad to caterpillars.” Which version is fully in your own words?`,a:0,o:[
  [`After sensing chewing earlier, the plants defended themselves better, producing extra bad-tasting chemicals when caterpillars actually showed up.`,`Same idea, completely new wording.`],
  [`The plants that had felt the chewing vibrations made more mustard oils.`,`This copies long strings of words from the article. Changing a word or two isn’t paraphrasing.`],
  [`Plants that felt the chewing vibrations earlier made more chemicals.`,`Still copied: “felt the chewing vibrations earlier” comes straight from the article.`],
  [`“The plants that had felt the chewing vibrations earlier made more mustard oils.”`,`Quotation marks give credit, but a summary should be in your own words.`]]}
]}};

/* ---------- Investigation 2: water temperature and plankton ---------- */
INV.plankton={
  key:'plankton', pick:`How does water temperature affect plankton?`,
  intro:`Today’s question: how does water temperature affect plankton? We’re growing L. polyedra, the tiny dinoflagellate that makes Southern California waves glow blue!`,
  names:{IS:'Planning Desk',DQ:'Culture Bench',EA:'Whiteboard',RC:'Bookshelf'},
  days:7,
  data:[[10,1100],[15,2900],[20,4600],[25,4200],[30,2300],[35,200]],
  dataHead:['Water temperature (°C)','Cell count after 7 days (cells/mL)'],
  dataNote:`Each count is an average of 5 flasks per temperature, across 3 trials. Every flask started with 500 cells/mL.`,
  fmt:v=>v.toLocaleString('en-US'),
  graph:{PL:30,xMax:40,xStep:5,yMax:5000,yStep:1000,fit:2,xLabel:'WATER TEMPERATURE (°C)',yLabel:'CELL COUNT (CELLS/ML)',
    title:['FIG. 1: EFFECT OF WATER TEMPERATURE ON','DINOFLAGELLATE CELL COUNT AFTER 7 DAYS']},
  propText:[`An incubator with six water baths. I wonder what we’ll use these for.`,`The incubator holds six water baths: 10, 15, 20, 25, 30, and 35 °C. Each group of flasks gets its own temperature.`],
  science:[`Before the reasoning, some background science. Inside every cell, enzymes speed up the chemical reactions that let the cell grow and divide.`,
    `Enzymes work faster as the temperature rises, but only up to a point. When it gets too hot, they start to lose their shape and stop working.`],
  rcIntro:`Other scientists have studied how ocean temperature affects plankton in the real ocean. Read these two articles carefully. You can re-read them during every question.`,
  note:`A note from Finn: the data in this experiment was invented for the game, but the rise, peak, and fall is the same pattern real phytoplankton show. The two articles are simplified summaries of real studies.`,
  art1:`<article class="art"><h3>Every Plankton Has a Favorite Temperature</h3>
<p class="src">Adapted from research by Mridul Thomas, Colin Kremer, Christopher Klausmeier, and Elena Litchman, Michigan State University (2012)</p>
<p>Phytoplankton are tiny ocean organisms that make food from sunlight, and they feed almost everything else in the sea. Researchers gathered lab measurements for 194 kinds of phytoplankton collected from all over the world, from icy polar water to warm tropical seas. For each one, they found its optimum temperature, the temperature where it grew fastest. Growth went up as the water warmed, peaked at the optimum, and then dropped.</p>
<p>Each kind of phytoplankton had an optimum close to the average temperature of the ocean where it came from. Tropical kinds were already living close to their limit, so even a little warming could push them past their best temperature. Using computer models, the researchers predicted that as oceans warm this century, many kinds will shift toward the poles, and tropical oceans could lose much of their phytoplankton variety.</p></article>`,
  art2:`<article class="art"><h3>A Warm-Water Blob and a Toxic Bloom</h3>
<p class="src">Adapted from research led by Ryan McCabe, University of Washington and NOAA (2016)</p>
<p>In 2013, a huge patch of unusually warm water formed in the northeast Pacific Ocean and lasted through 2015. Scientists nicknamed it “the Blob.” Its surface water was more than 2.5 °C warmer than normal. In spring 2015, a diatom called Pseudo-nitzschia australis spread farther north than it normally lives and formed a giant bloom along the West Coast.</p>
<p>This diatom can make domoic acid, a toxin that builds up in shellfish and crabs. The 2015 bloom caused the largest outbreak of this toxin ever recorded on the coast. Sea lions got sick, and fisheries for razor clams and Dungeness crab were shut down. In lab experiments, cells from the bloom divided two to three times faster when they were given warmer temperatures and more nutrients. The Blob was not caused by climate change, but scientists see it as a preview of what a warmer ocean could bring.</p></article>`,
  model:`<p>Here’s what a strong synthesis paragraph could look like:</p>
<p class="model">Both studies show that temperature controls how well plankton grow, so a change in ocean temperature can change which plankton thrive and where. When scientists compared 194 kinds of phytoplankton from around the world, each grew fastest near the average temperature of its home waters, and tropical kinds were already close to their limit. That pattern helps explain 2015, when an unusually warm patch of the Pacific let a toxic diatom spread beyond its usual range and bloom along the West Coast, sickening sea lions and closing crab and clam fisheries. Together, the studies suggest that as oceans warm, the plankton at the base of the food web may shift in ways that reach all the way to people.</p>
<p>It opens with the idea that links both studies, includes the key finding from each, skips the rabbit holes, weaves the articles together, and every sentence is in new words.</p>`,
  Q:{

  [`Cells grow and divide using enzymes. Warmer water speeds up enzyme reactions, so cells divided faster up to an optimum temperature. Above that, the enzymes start to lose their shape and stop working, so growth dropped. This explains why the cell count rose and then fell.`,`It uses a science concept to connect the IV to the DV, and it explains both the rise and the fall.`],

  [`Warm water does things to plankton.`,`Too general. This could describe almost any article about the ocean.`],

  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){const f=A[j][i]/A[i][i]; for(let k=i;k<=n;k++) A[j][k]-=f*A[i][k];}
  const c=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let s=A[i][n]; for(let k=i+1;k<n;k++) s-=A[i][k]*c[k]; c[i]=s/A[i][i];}
  return x=>c.reduce((s,ci,k)=>s+ci*Math.pow(x,k),0);
}
function drawGraph(c){
  const inv=I(), G=S.graph, cfg=inv.graph, data=inv.data;
  const g=c.getContext('2d'), W=176, H=142, PL=cfg.PL, PR=170, PT=8, PB=100;
  g.fillStyle=C[3]; g.fillRect(0,0,W,H);
  if(!G.axes){const m='NO GRAPH YET'; txt(g,m,Math.round((W-tw(m))/2),68,C[1]); return;}
  const xp=v=>Math.round(PL+v*(PR-PL)/cfg.xMax), yp=v=>Math.round(PB-v*(PB-PT)/cfg.yMax);
  if(G.scale){
    g.fillStyle=C[2];
    for(let v=cfg.yStep;v<=cfg.yMax;v+=cfg.yStep) for(let x=PL+2;x<=PR;x+=2) g.fillRect(x,yp(v),1,1);
  }
  g.fillStyle=C[0]; g.fillRect(PL,PT,1,PB-PT+1); g.fillRect(PL,PB,PR-PL+1,1);
  if(G.scale){
    for(let v=0;v<=cfg.xMax;v+=cfg.xStep){const X=xp(v),s=String(v); g.fillStyle=C[0]; g.fillRect(X,PB+1,1,2); txt(g,s,X-Math.floor(tw(s)/2),PB+4,C[0]);}
    for(let v=0;v<=cfg.yMax;v+=cfg.yStep){const Y=yp(v),s=String(v); g.fillStyle=C[0]; g.fillRect(PL-2,Y,2,1); txt(g,s,PL-4-tw(s),Y-2,C[0]);}
  }
  if(G.trend){
    const f=fitPoly(data,cfg.fit), x0=data[0][0], x1=data[data.length-1][0];
    g.fillStyle=C[1]; let prev=null;
    for(let X=xp(x0);X<=xp(x1);X++){
      const v=Math.max(0,f(x0+(X-xp(x0))*(x1-x0)/(xp(x1)-xp(x0)))), Y=yp(v);
      if(prev===null) g.fillRect(X,Y,1,2);
      else{const a=Math.min(prev,Y),b=Math.max(prev,Y); g.fillRect(X,a,1,b-a+2);}
      prev=Y;
    }
  }
  if(G.scale){
    data.forEach(d=>{const X=xp(d[0]),Y=yp(d[1]); g.fillStyle=C[0]; g.fillRect(X-2,Y-2,5,5); g.fillStyle=C[2]; g.fillRect(X-1,Y-1,3,3);});
  }
  if(G.x) txt(g,cfg.xLabel,Math.round((PL+PR)/2-tw(cfg.xLabel)/2),PB+11,C[0]);
  if(G.y) txt(g,cfg.yLabel,3,Math.round((PT+PB)/2+tw(cfg.yLabel)/2),C[0],true);
  if(G.title){
    const a=cfg.title[0], b=cfg.title[1];
    txt(g,a,Math.round((W-tw(a))/2),PB+23,C[0]); txt(g,b,Math.round((W-tw(b))/2),PB+31,C[0]);
  }
}

function tone(f,d,vol,delay){
  if(!S.sound||!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+(delay||0);
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.035,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.03);
  }catch(e){}
}

function choose(i){
  if(!QS||QS.done||QS.tried.has(i)) return;
  const q=QS.q, btns=[...ov.querySelectorAll('.opt')], fb=ov.querySelector('.fb');
  if(i===q.a){
    QS.done=true;
    btns.forEach(b=>{b.classList.remove('sel');b.setAttribute('aria-disabled','true');});
    btns[i].classList.add('right');
    let earn=0,bonus=0;
    if(!(q.uid in S.results)){
      S.results[q.uid]=QS.first; earn=QS.first?2:1;
      if(QS.first){S.streak++; if(S.streak%3===0) bonus=1;} else S.streak=0;
      S.pearls+=earn+bonus;
    }
    fb.className='fb ok'; fb.innerHTML=`<b>${QS.first?'★ First try!':'✓ Got it!'}</b> ${q.o[i][1]}${earn?`<span class="earn">+${earn} <i class="pearl"></i>${bonus?` STREAK x${S.streak}! +1 bonus <i class="pearl"></i>`:''}</span>`:''}`;
    sfx.right(); if(earn) popPearls(earn+bonus,bonus);
    if(q.fx){S.graph[q.fx]=true; const g=ov.querySelector('canvas.graph'); if(g) drawGraph(g);}
    updateHud();

    const c=ov.querySelector('.cont'); c.hidden=false; c.focus({preventScroll:true}); c.scrollIntoView({block:'nearest'});
  } else {
    QS.first=false; QS.tried.add(i);
    btns[i].classList.add('wrong'); btns[i].classList.remove('sel'); btns[i].setAttribute('aria-disabled','true');
    fb.className='fb no'; fb.innerHTML=`<b>✗ Not quite.</b> ${q.o[i][1]}`;
    sfx.wrong();
    let j=i; for(let k=1;k<=btns.length;k++){const t=(i+k)%btns.length; if(!QS.tried.has(t)){j=t;break;}}
    setSel(j,false,false);
    fb.scrollIntoView({block:'nearest'});
  }
}
function showPanel(p){
  ov.className='ov show';
  const body=typeof p.html==='function'?p.html():p.html;
  ov.innerHTML=`<div class="panel" role="dialog" aria-label="${p.tag}"><div class="ptag"><span class="sk">${p.tag}</span></div>
    ${p.graph?'<canvas class="graph" width="176" height="142" aria-label="Your completed graph"></canvas>':''}
    ${body}<div class="btnrow">${p.buttons||'<button class="cont">CONTINUE ▶</button>'}</div></div>`;
  const g=ov.querySelector('canvas.graph'); if(g) drawGraph(g);
  ov.querySelectorAll('canvas[data-badge]').forEach(cv2=>drawBadge(cv2,cv2.dataset.badge));
  ov.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.act==='again') reset();}));
  const c=ov.querySelector('.cont'); if(c){c.addEventListener('click',()=>next()); c.focus({preventScroll:true});}
}
function showCut(){
  ov.className='ov show';
  ov.innerHTML='<div class="banner" role="status"><span class="b1">TRIAL 1</span><span class="b2">DAY 1</span></div>';
  S.cut={t0:performance.now(),D:4500,day:1,trial:1,b1:ov.querySelector('.b1'),b2:ov.querySelector('.b2'),gen:S.gen};
}
function tickCut(){
  const c=S.cut; if(!c) return;
  const p=(performance.now()-c.t0)/c.D, days=I().days;
  if(p>=1){
    S.growth=1; c.b1.textContent='3 TRIALS'; c.b2.textContent='DONE!'; S.cut=null; sfx.done();
    setTimeout(()=>{if(c.gen===S.gen&&cur&&cur.t==='cut') next();},1100);
    return;
  }
  const trial=Math.min(3,Math.floor(p*3)+1), tp=(p*3)%1, day=1+Math.floor((days-1)*tp+0.0001);
  S.growth=tp;
  if(day!==c.day||trial!==c.trial){c.day=day;c.trial=trial;c.b1.textContent='TRIAL '+trial;c.b2.textContent='DAY '+day;tone(330+day*18,0.03,0.012);}
}

/* ---------- actions ---------- */
function interact(){
  const n=nearby(); if(!n) return;
  sfx.sel();
  if(n==='SPROUT'){
    if(S.stage>=4) run([SAY(`Here’s your Lab Report!`),reportPanel()]);
    else run([SAY(hintText())]);
    return;
  }
  if(n==='PROP'){ run([SAY(I().propText[S.stage===0?0:1])]); return; }
  const i=ORDER.indexOf(n);
  if(i<S.stage) run([SAY(`You already finished the ${I().names[n]}. Nice work!`)]);
  else if(i>S.stage) run([SAY(`Not yet! This station needs results from earlier steps. ${hintText()}`)]);
  else {S.spStart=S.pearls; run(scriptFor(n));}
}
function pressA(){
  unlockAudio();
  if(S.mode==='title'){startGame();return;}
  if(S.mode==='walk'){interact();return;}
  if(!cur) return;
  if(cur.t==='say'){
    if(typing&&typing.i<typing.full.length) finishTyping(); else {sfx.sel(); next();}
  } else if(cur.t==='q'){
    if(QS&&QS.done) next(); else if(QS) choose(QS.sel);
  } else if(cur.t==='choose'){
    const ae=document.activeElement; if(ae&&ae.classList.contains('choice')) ae.click(); else {const b=ov.querySelector('.choice'); if(b) b.click();}
  } else if(cur.t==='panel'||cur.t==='badge'||cur.t==='trophy'){ next(); }
}
function pressB(){
  unlockAudio();
  if(S.mode==='title'){startGame();return;}
  if(S.mode==='walk'){run([SAY(hintText())]);return;}
  if(cur&&cur.t==='say') pressA();
}
function pressStart(){
  unlockAudio();
  if(S.mode==='title'){startGame();return;}
  if(S.mode==='walk') run([SAY(`Controls: arrow keys, WASD, or the D-pad to walk. A (Space or Enter) to talk and choose. B (X) for a hint.`)]);
}
function startGame(){
  document.getElementById('title').classList.add('hide');
  sfx.start(); S.mode='walk'; updateHud(); run(INTRO);
}
function reset(){
  S.gen++; queue=[]; cur=null; QS=null; onDone=null; S.cut=null; closeOv();
  Object.assign(S,{mode:'title',px:72,py:66,walkT:0,moving:false,stage:0,growth:0,results:{},pearls:0,streak:0,spStart:0});
  S.graph={axes:false,x:false,y:false,scale:false,trend:false,title:false};
  held.up=held.down=held.left=held.right=false;
  document.getElementById('title').classList.remove('hide');
  updateHud();
}
const hud=document.getElementById('hud');
function updateHud(){
  hud.innerHTML=ORDER.map((id,i)=>{
    const st=S.mode==='title'?'':i<S.stage?'done':i===S.stage?'now':'';
    return `<span class="chip ${st}">${id}${i<S.stage?' ✓':''}</span>`;}).join('')+`<span class="chip pearls" title="Pearls"><i class="pearl"></i>${S.pearls}</span>`;
}

/* ---------- input ---------- */
const KEYDIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'};
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const dir=KEYDIR[e.key];
  if(dir){
    if(S.mode==='walk'){e.preventDefault();held[dir]=true;}
    else if(cur&&(cur.t==='q'||cur.t==='choose')){e.preventDefault(); moveSel(dir==='up'||dir==='left'?-1:1);}
    return;
  }
  const k=e.key;
  if(k===' '||k==='Enter'||k==='z'||k==='Z'){
    const ae=document.activeElement;
    if((k===' '||k==='Enter')&&ae&&(ae.tagName==='BUTTON'||ae.tagName==='SUMMARY')&&ov.contains(ae)) return;
    e.preventDefault(); if(!e.repeat) pressA(); return;
  }
  if(k==='x'||k==='X'||k==='b'||k==='B'){e.preventDefault(); if(!e.repeat) pressB();}
});
addEventListener('keyup',e=>{const dir=KEYDIR[e.key]; if(dir) held[dir]=false;});
addEventListener('blur',()=>{held.up=held.down=held.left=held.right=false;});

document.querySelectorAll('[data-dir]').forEach(b=>{
  const d=b.dataset.dir;
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('pointerdown',e=>{
    e.preventDefault(); unlockAudio(); b.classList.add('on');
    if(S.mode==='walk') held[d]=true;
    else if(cur&&(cur.t==='q'||cur.t==='choose')) moveSel(d==='up'||d==='left'?-1:1);
  });
  const off=()=>{b.classList.remove('on'); held[d]=false;};
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off));
});
document.querySelectorAll('[data-btn]').forEach(b=>{
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('pointerdown',e=>{
    e.preventDefault(); b.classList.add('on');
    const w=b.dataset.btn;
    if(w==='A') pressA(); else if(w==='B') pressB(); else if(w==='START') pressStart();
    else if(w==='SOUND'){unlockAudio(); S.sound=!S.sound; document.getElementById('sndlbl').textContent=S.sound?'SOUND ON':'SOUND OFF'; if(S.sound) sfx.sel();}
  });
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')));
});
document.getElementById('title').addEventListener('click',()=>pressA());

/* ---------- loop ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(50,ts-(last||ts)); last=ts; S.t+=dt;
  if(S.mode==='walk'){
    let dx=(held.right?1:0)-(held.left?1:0), dy=(held.down?1:0)-(held.up?1:0);
    if(dx&&dy){dx*=0.7071;dy*=0.7071;}
    S.moving=!!(dx||dy);
    const sp=0.058*dt;
    if(dx) tryMove(dx*sp,0);
    if(dy) tryMove(0,dy*sp);
    if(S.moving) S.walkT+=dt;
  } else S.moving=false;
  if(typing&&typing.i<typing.full.length){
    typing.acc+=dt; let added=0;
    while(typing.acc>=18&&typing.i<typing.full.length){typing.acc-=18;typing.i++;added++;}
    if(added){typing.el.textContent=typing.full.slice(0,typing.i); if(typing.i%3<added) sfx.blip(); if(typing.i>=typing.full.length) finishTyping();}
  }
  tickCut();
  render();
  requestAnimationFrame(loop);
}
updateHud();
requestAnimationFrame(loop);
})();
</script>
